# Environment the released weights were validated in.
#
# PyTorch is the CUDA 12.1 build; the vendored alphafold3/cpp extension is
# compiled for Python 3.11 and will not import under another version.
#
#   conda env create --file environment.yaml
#   conda activate onixbind
